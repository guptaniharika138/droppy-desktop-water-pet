<!DOCTYPE html>
<html>
<head>
<style>
    html, body{
        margin: 0;
        background: transparent;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
    }
    .footprint{
        position: absolute;
        width: 14px;
        height: 14px;
        transform: translate(-50%, -50%);
        animation: footprintFade 1.4s ease forwards;
        pointer-events: none;
    }
    .footprint svg{
        width: 100%;
        height: 100%;
        display: block;
    }
    @keyframes footprintFade{
        0%{ opacity: 0.75; transform: translate(-50%, -50%) scale(1); }
        100%{ opacity: 0; transform: translate(-50%, -30%) scale(0.8); }
    }
</style>
</head>
<body>
<script src="footprintsScript.js"></script>
</body>
</html>
