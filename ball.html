<!DOCTYPE html>
<html>
<head>
<style>
    body{
        margin:0;
        background:transparent;
        display:flex;
        align-items:center;
        justify-content:center;
        height:100vh;
        overflow:hidden;
    }
    #ball{
        font-size:26px;
        transform-origin:center;
    }
    #ball.bounce{
        animation: ballBounce 0.4s ease;
    }
    @keyframes ballBounce{
        0%{ transform: scale(1,1); }
        30%{ transform: scale(1.3,0.7); }
        60%{ transform: scale(0.85,1.15); }
        100%{ transform: scale(1,1); }
    }
</style>
</head>
<body>
<div id="ball">🎾</div>
<script src="ballScript.js"></script>
</body>
</html>
